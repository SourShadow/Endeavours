plugins {
 id 'java-library'
 id 'net.neoforged.gradle.userdev' version '7.1.39'
}
version = '0.1.0'
group = 'dev.endeavours.locator'
base { archivesName = 'endeavours_locator' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
dependencies { implementation 'net.neoforged:neoforge:26.1.2.116' }
runs {
 configureEach {
  workingDirectory project.layout.projectDirectory.dir('run').dir(name)
  modSource project.sourceSets.main
 }
 client {}
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
