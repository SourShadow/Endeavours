name: Build Locator Friends
on:
  push:
    branches: [build/locator-friends-26-1-2]
    paths:
      - 'locator-friends/src/**'
      - 'locator-friends/build.gradle'
      - 'locator-friends/gradle.properties'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build .109-compatible Locator Friends against Minecraft 26.1.2
        run: ./gradlew -p locator-friends build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Endeavours-Locator-Friends-NeoForge-26.1.2.109
          path: locator-friends/build/libs/endeavours_locator-0.1.1.jar
          if-no-files-found: error
      - name: Publish compiled JAR to isolated branch
        run: |
          mkdir -p locator-friends/dist
          cp locator-friends/build/libs/endeavours_locator-0.1.1.jar locator-friends/dist/Endeavours-Locator-Friends-NeoForge-26.1.2.109.jar
          git config user.name "Endeavours build bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locator-friends/dist/Endeavours-Locator-Friends-NeoForge-26.1.2.109.jar
          git commit -m "Update compiled Locator Friends 26.1.2.109-compatible JAR"
          git push origin HEAD:build/locator-friends-26-1-2
