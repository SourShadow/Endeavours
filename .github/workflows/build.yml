name: Build Locator Friends
on:
  push:
    branches: [build/locator-friends-26-1-2]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile NeoForge 26.1.2
        run: ./gradlew -p locator-friends build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Endeavours-Locator-Friends-26.1.2-JAR
          path: locator-friends/build/libs/*.jar
          if-no-files-found: error
      - name: Commit compiled JAR to build branch
        run: |
          mkdir -p locator-friends/dist
          cp locator-friends/build/libs/endeavours_locator-0.1.0.jar locator-friends/dist/Endeavours-Locator-Friends-26.1.2.jar
          git config user.name "Endeavours build bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locator-friends/dist/Endeavours-Locator-Friends-26.1.2.jar
          git commit -m "Add compiled Locator Friends 26.1.2 JAR"
          git push origin HEAD:build/locator-friends-26-1-2
